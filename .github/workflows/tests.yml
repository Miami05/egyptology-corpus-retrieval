# Runs the test suite on every push to main and on every pull request, so a change
# that breaks a test is caught on GitHub before it reaches the server.
name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The corpus (data/processed/examples.csv) is a Git LFS file. Check out without
      # it, then restore it from the Actions cache, so only a changed corpus is
      # downloaded from LFS; every download counts against the repository's LFS budget.
      - uses: actions/checkout@v4

      - name: List LFS objects
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-objects

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}

      - name: Fetch the corpus from LFS
        run: git lfs pull

      # 3.12 is the server's Python: the pins have no 3.14 wheels (README).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      # The lock holds every package at the version the server runs.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c requirements.lock

      - name: Run the tests
        run: python -m pytest tests/ -q
