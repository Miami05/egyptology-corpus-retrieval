# Committed deploy config. Secrets live in .streamlit/secrets.toml, which is
# gitignored — set those in the Streamlit Cloud dashboard instead.

[server]
# The corpus CSV is ~8 MB; keep uploads modest so a bad request cannot exhaust
# the container's memory.
maxUploadSize = 20

# Serves ./static at /app/static/. Required for the self-hosted Gentium Plus
# subset that renders Egyptological transliteration — see whyptology_theme.css.
enableStaticServing = true

[browser]
gatherUsageStats = false
