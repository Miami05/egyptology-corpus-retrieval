# Committed deploy config. Secrets live in .streamlit/secrets.toml, which is
# gitignored; on the server they come from ~/egyptology.env (see DEPLOYMENT.md).

[server]
# The corpus CSV is ~8 MB; keep uploads modest so a bad request cannot exhaust
# the container's memory.
maxUploadSize = 20

[client]
# Public site: the browser gets a generic "this app has encountered an error"
# message instead of a traceback with server paths. The full traceback still goes
# to the service journal (and the terminal when running locally).
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[theme]
# Pin the light theme. Without this Streamlit follows the *viewer's* system
# dark/light preference for its own components, while whyptology_theme.css paints a
# fixed light content surface — so on a machine set to dark mode Streamlit rendered
# alert text in its near-white dark-theme colour on a pale alert tint, making every
# st.warning / st.info unreadable. Those alerts carry the messages this tool exists
# to deliver: "no attested parallel", "read-only mode", "annotations are not stored
# durably". Invisible honesty is worse than none.
base = "light"
backgroundColor = "#fbf9f4"
secondaryBackgroundColor = "#f2eee4"
textColor = "#14231f"
primaryColor = "#1f6f5c"
